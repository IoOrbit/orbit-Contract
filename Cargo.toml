[workspace]
resolver = "2"
members = [
    "contracts/guild",
    "contracts/escrow", 
    "contracts/achievement",
    "contracts/reward",
    "contracts/registry",
]

[workspace.dependencies]
soroban-sdk = "20.0.0"
soroban-sdk-macros = "20.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
overflow-checks = true
